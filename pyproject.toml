[project]
name = "observe-kit"
version = "0.1.1"
description = "@observed: one decorator that times a call, classifies how it ended, logs it and emits an event."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Georg Kasper" }]
requires-python = ">=3.11"
dependencies = ["structlog>=24.1"]
keywords = ["observability", "decorator", "structlog", "logging", "metrics", "events"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MdaaaaO/observe-kit"
Changelog = "https://github.com/MdaaaaO/observe-kit/blob/main/CHANGELOG.md"
Issues = "https://github.com/MdaaaaO/observe-kit/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11", "ruff>=0.6", "conventional-release>=0.1.2,<1"]

[tool.conventional-release]
version-files = ["pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
relative_files = true
source = ["observe_kit"]

[tool.coverage.report]
fail_under = 95
show_missing = true
